seed: 20260708
deterministic: false
run_dir: simple/diffusion_EDM/runs/local_sfaf_fusion_smoke

data:
  coarse_dir: simple/get_pic/output_dataset/coarse_maps
  x_dir: simple/get_pic/output_dataset/x_matrix
  label_dir: simple/f_domain/output_dataset/streaming_dataset_a_frequency_shell/labels
  sample_ids: 1-2
  image_size: 256
  val_fraction: 0.0
  use_raw_pic: false
  x_normalization: robust_per_sample
  pic_channels:
    - ray_log_amp_loss
    - ray_relative_delta
    - ray_phase_change
    - low_frequency_band_map
    - mid_frequency_band_map
    - high_frequency_band_map
    - path_coverage
    - reliability_mask

loader:
  batch_size: 1
  val_batch_size: 1
  num_workers: 0
  pin_memory: false
  drop_last: false

model:
  image_size: 256
  target_channels: 1
  x_channels: 7
  frequency_count: 15
  base_channels: 16
  channel_mult: [1, 2]
  num_res_blocks: 1
  attention_resolutions: []
  cond_dim: 64
  x_hidden_channels: 16
  x_token_dim: 64
  spatial_frequency_fusion:
    resolutions: [128]
    heads: 4
    filter_kernel_size: 5
    physical_position:
      tx_count: 16
      rx_count: 16
      pipe_length_mm: 1000.0
      mid_radius_mm: 155.0
      tx_z_mm: 100.0
      rx_z_mm: 900.0
      frequency_reference_hz: 100000.0
  dropout: 0.0
  self_condition_prob: 0.5

edm:
  sigma_data: 0.5
  sigma_min: 0.002
  sigma_max: 5.0
  p_mean: -1.2
  p_std: 1.2
  rho: 7.0

train:
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0001
  warmup_steps: 1
  min_lr_ratio: 0.05
  amp: false
  amp_dtype: float16
  grad_clip: 1.0
  ema: true
  ema_decay: 0.999
  log_every_steps: 1
  save_every_steps: 10
  val_every_steps: 10

loss:
  lambda_x0_l1: 0.05
  lambda_tv: 0.001
  lambda_range: 0.01
  lambda_coverage_l1: 0.0
  lambda_spectral: 0.01
  lambda_phys_v1: 0.0
  phys_feature_index: 1
  phys_start_step: 20000
  phys_warmup_steps: 60000

sample:
  steps: 5
  sigma_min: 0.002
  sigma_max: 5.0
  rho: 7.0
  s_churn: 0.0
  s_tmin: 0.0
  s_tmax: .inf
  s_noise: 1.0
  physics_guidance_scale: 0.0
  physics_guidance_start_fraction: 0.5
  uncertainty:
    num_samples: 4
    sample_seed: 20260712
    lower_quantile: 0.05
    upper_quantile: 0.95
    defect_threshold: 0.1
    consensus_probability_threshold: 0.5
    save_all_samples: false
