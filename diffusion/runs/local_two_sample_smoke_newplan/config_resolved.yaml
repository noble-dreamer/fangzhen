seed: 20260702
deterministic: false
run_dir: simple/diffusion/runs/local_two_sample_smoke
data:
  coarse_dir: simple/get_pic/output_dataset/coarse_maps
  x_dir: simple/get_pic/output_dataset/x_matrix
  label_dir: simple/f_domain/output_dataset/streaming_dataset_a_frequency_shell/labels
  sample_ids: 1-2
  image_size: 256
  val_fraction: 0.0
  use_raw_pic: false
  x_normalization: robust_per_sample
  pic_channels:
  - ray_log_amp_loss
  - ray_relative_delta
  - ray_phase_change
  - low_frequency_band_map
  - mid_frequency_band_map
  - high_frequency_band_map
  - path_coverage
  - reliability_mask
loader:
  batch_size: 1
  val_batch_size: 1
  num_workers: 0
  pin_memory: false
  drop_last: false
model:
  image_size: 256
  target_channels: 1
  x_channels: 7
  frequency_count: 15
  base_channels: 16
  channel_mult:
  - 1
  - 2
  num_res_blocks: 1
  attention_resolutions: []
  cond_dim: 64
  x_hidden_channels: 16
  x_token_dim: 64
  use_x_tokens: true
  cross_attention_resolutions:
  - 128
  cross_attention_heads: 4
  use_pic_adapter: true
  self_condition: true
  self_condition_prob: 0.5
  dropout: 0.0
diffusion:
  timesteps: 10
  beta_schedule: cosine
  prediction_type: v_prediction
train:
  epochs: 1
  lr: 0.0001
  weight_decay: 0.0001
  warmup_steps: 1
  min_lr_ratio: 0.05
  amp: false
  amp_dtype: float16
  grad_clip: 1.0
  ema: true
  ema_decay: 0.999
  log_every_steps: 1
  save_every_steps: 10
  val_every_steps: 10
loss:
  lambda_l1: 1.0
  lambda_ssim: 0.1
  lambda_x0_l1: 0.05
  lambda_tv: 0.0001
  lambda_range: 0.01
  lambda_coverage_l1: 0.0
  lambda_phys_v1: 0.0
  phys_frequency_aware: false
  phys_feature_index: 1
sample:
  steps: 5
  eta: 0.0
_config_path: simple\diffusion\configs\local_two_sample_smoke.yaml
